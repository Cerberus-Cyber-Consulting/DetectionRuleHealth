name: Idea or feature request
description: Suggest an improvement for Detection Rule Health.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the detection engineering task, not only the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: markdown
    attributes:
      value: Please keep tenant data out of the issue.
