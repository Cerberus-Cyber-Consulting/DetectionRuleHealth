# Tag-driven release: push a tag like v0.1.0-beta.1 and this workflow
#   1. tests the tagged commit,
#   2. builds linux/amd64 + linux/arm64 images with SBOM and provenance and pushes them to GHCR,
#   3. signs the image with cosign (keyless) and publishes a GitHub build attestation,
#   4. creates the GitHub Release (prerelease when the version contains "-") from CHANGELOG.md.
# The in-app update check reads these GitHub Releases.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cerberus-cyber-consulting/detectionrulehealth

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"
      - name: Rules for the extraction golden test (same as ci.yml)
        run: |
          git clone --quiet https://github.com/HybridBrothers/Hunting-Queries-Detection-Rules.git "$RUNNER_TEMP/hb"
          git -C "$RUNNER_TEMP/hb" checkout --quiet -B main 53ac682d11cdac141b9e3071bb0a9402d36f5e69
          echo "RULEHEALTH_HB_REPO=$RUNNER_TEMP/hb" >> "$GITHUB_ENV"
      - run: dotnet test -c Release
      - name: Release readiness (forbidden content, versions, required files)
        shell: pwsh
        run: ./tools/Test-ReleaseReadiness.ps1 -Tag "${{ github.ref_name }}"

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless signing + attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $VERSION"; exit 1; }
          cat >> notes.md <<NOTES

          ## Image

          \`\`\`
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Digest: \`${DIGEST}\` (linux/amd64, linux/arm64). Verify with
          \`gh attestation verify oci://${IMAGE}:${VERSION} -R ${GITHUB_REPOSITORY}\`.

          Setup guide: https://cerberus-cyber-consulting.github.io/DetectionRuleHealth/setup/
          NOTES
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Detection Rule Health ${{ needs.image.outputs.version }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
