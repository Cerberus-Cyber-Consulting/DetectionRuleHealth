# Tag-driven release: push a tag like v0.1.0-beta.1 and this workflow
#   1. tests the tagged commit,
#   2. builds linux/amd64 + linux/arm64 images with SBOM and provenance and pushes them to GHCR,
#   3. signs the image with cosign (keyless) and publishes a GitHub build attestation,
#   4. creates the GitHub Release (prerelease when the version contains "-") from CHANGELOG.md.
# The in-app update check reads these GitHub Releases.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cerberus-cyber-consulting/detectionrulehealth

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Rules for the extraction golden test (same as ci.yml)
        run: |
          git clone --quiet https://github.com/HybridBrothers/Hunting-Queries-Detection-Rules.git "$RUNNER_TEMP/hb"
          git -C "$RUNNER_TEMP/hb" checkout --quiet -B main 53ac682d11cdac141b9e3071bb0a9402d36f5e69
          echo "RULEHEALTH_HB_REPO=$RUNNER_TEMP/hb" >> "$GITHUB_ENV"
      - run: dotnet test -c Release
      - name: Release readiness (forbidden content, versions, required files)
        shell: pwsh
        run: ./tools/Test-ReleaseReadiness.ps1 -Tag "${{ github.ref_name }}"

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless signing + attestation
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=beta,enable=${{ contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $VERSION"; exit 1; }
          cat >> notes.md <<NOTES

          ## Image

          \`\`\`
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Digest: \`${DIGEST}\` (linux/amd64, linux/arm64). Verify with
          \`gh attestation verify oci://${IMAGE}:${VERSION} -R ${GITHUB_REPOSITORY}\`.

          Setup guide: https://cerberus-cyber-consulting.github.io/DetectionRuleHealth/setup/
          NOTES
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Detection Rule Health ${{ needs.image.outputs.version }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
