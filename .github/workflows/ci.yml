# Build, test and check every push and pull request. Never publishes anything.
# Action versions: run `pwsh tools/Update-ActionPins.ps1` to pin them to commit SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Rules for the extraction golden test
        # Robbe's public HybridBrothers rules at the baseline commit, outside the workspace so the
        # release-readiness scan never reads them. Branch `main`: rule links in the sample use it.
        run: |
          git clone --quiet https://github.com/HybridBrothers/Hunting-Queries-Detection-Rules.git "$RUNNER_TEMP/hb"
          git -C "$RUNNER_TEMP/hb" checkout --quiet -B main 53ac682d11cdac141b9e3071bb0a9402d36f5e69
          echo "RULEHEALTH_HB_REPO=$RUNNER_TEMP/hb" >> "$GITHUB_ENV"
      - name: Build and test
        run: dotnet test -c Release --logger "console;verbosity=normal"
      - name: Brand compliance (app UI)
        shell: pwsh
        run: ./tools/Test-BrandCompliance.ps1
      - name: Release readiness (incl. docs site brand and privacy checks)
        shell: pwsh
        run: ./tools/Test-ReleaseReadiness.ps1

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (both architectures, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=0.0.0-ci.${{ github.run_number }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64)
        run: |
          docker buildx build --load --build-arg VERSION=0.0.0-ci -t drh:ci .
          docker run -d --name drh-ci -p 127.0.0.1:5180:5180 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges drh:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' drh-ci); [ "$s" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' drh-ci | grep -qx healthy
          curl -fsS http://localhost:5180/api/app | grep -q '"version"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example:5180' http://localhost:5180/api/tenants)" = 421
          # A body is needed: HttpListener answers 411 to a body-less POST before the CSRF check runs.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:5180/api/tenants)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 127.0.0.1:5180' http://localhost:5180/)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5180/healthz)" = 404   # loopback only
          docker exec drh-ci /app/rulehealth health
          docker logs drh-ci
          docker rm -f drh-ci
